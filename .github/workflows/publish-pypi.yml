name: Publish to PyPI

# Publish release tags only after their commit is on main and passes main CI.
#
# Prerequisites (one-time, on the PyPI side):
#   1. Register the `ckanext-pen` package name on https://pypi.org/
#   2. On the package page, enable "Trusted Publisher"
#        Repository : hkwi/ckanext-pen
#        Workflow   : publish-pypi.yml
#        Environment: pypi
#      (PyPI will show this exact workflow name; it must match.)
#
# With Trusted Publisher, no PyPI API token secret is needed in the repo.

on:
  push:
    tags:
      - 'v**'

permissions: {}

jobs:
  verify-release:
    name: Verify merged release and main CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout release tag and main history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release eligibility
        run: python3 .github/scripts/verify-release.py
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build distribution
    needs: [verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pypa/build
        run: python3 -m pip install --user build

      - name: Build a wheel and a source tarball
        run: python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish Python distribution on PyPI
    needs: [verify-release, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ckanext-pen
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

# Legacy metadata is in pyproject.toml (PEP 621).
# This file is kept for tool configuration that still reads setup.cfg.

[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/pen/i18n/ckanext-pen.pot
width = 80

[init_catalog]
domain = ckanext-pen
input_file = ckanext/pen/i18n/ckanext-pen.pot
output_dir = ckanext/pen/i18n

[update_catalog]
domain = ckanext-pen
input_file = ckanext/pen/i18n/ckanext-pen.pot
output_dir = ckanext/pen/i18n
previous = true

[compile_catalog]
domain = ckanext-pen
directory = ckanext/pen/i18n
statistics = true

[tool:pytest]
filterwarnings =
        ignore::sqlalchemy.exc.SADeprecationWarning
        ignore::sqlalchemy.exc.SAWarning
        ignore::DeprecationWarning
addopts = --ckan-ini test.ini
markers =
        e2e: end-to-end tests that exercise the CKAN web app and database
